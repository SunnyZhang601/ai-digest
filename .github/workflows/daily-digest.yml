name: daily-digest

on:
  schedule:
    # 07:10 UTC = 15:10 北京时间。上游 feed 每天 ~06:43 UTC 提交，留 27 分钟余量。
    # 注意：GitHub 免费层的定时任务可能延迟 15-60 分钟。
    - cron: '10 7 * * *'
  workflow_dispatch: {} # 允许手动触发（测试用）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch upstream feeds
        run: |
          mkdir -p feeds
          curl -sfL --retry 3 -o feeds/feed-x.json       https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-x.json
          curl -sfL --retry 3 -o feeds/feed-podcasts.json https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-podcasts.json
          curl -sfL --retry 3 -o feeds/feed-blogs.json    https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-blogs.json
          for f in feeds/*.json; do
            head -c 1 "$f" | grep -q '{' || { echo "BAD FEED: $f"; exit 1; }
          done

      - name: Build digest and send to Feishu
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/build_digest.py

      - name: Commit digest and state
        run: |
          git config user.name  "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push

      - name: Publish to Horizon site
        env:
          HORIZON_TOKEN: ${{ secrets.HORIZON_TOKEN }}
        run: |
          DATE=$(date -u -d "yesterday" +%F)
          SRC="digests/$DATE.md"
          if [ ! -f "$SRC" ]; then echo "no digest for $DATE, skip publish"; exit 0; fi
          { printf -- '---\nlayout: default\ntitle: "AI Builders Digest %s"\ndate: %s\n---\n\n' "$DATE" "$DATE"; cat "$SRC"; } > publish.md
          B64=$(base64 -w0 publish.md)
          API="https://api.github.com/repos/SunnyZhang601/Horizon/contents/docs/ai-builders/$DATE.md"
          SHA=$(curl -sf -H "Authorization: Bearer $HORIZON_TOKEN" -H "Accept: application/vnd.github+json" "$API" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])" || true)
          jq -n --arg msg "AI Builders Digest $DATE" --arg b64 "$B64" --arg sha "$SHA" \
            '{message:$msg, content:$b64, branch:"main"} + (if $sha == "" then {} else {sha:$sha} end)' > payload.json
          curl -sf -X PUT -H "Authorization: Bearer $HORIZON_TOKEN" -H "Accept: application/vnd.github+json" \
            -d @payload.json "$API" > /dev/null && echo "published: docs/ai-builders/$DATE.md"
